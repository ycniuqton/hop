# Two-machine demo layout: no status bar, each pane titled with its machine name on the border.
set -g status off
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour45"
set -g pane-border-format "#{?pane_active,#[fg=colour16#,bg=colour45#,bold],#[fg=colour250#,bg=colour238]}  #{pane_title}  "
set -g allow-rename off
# prefix + J pastes server-1's join code, the way a user would paste it from the other screen.
bind-key J run-shell 'tmux set-buffer -- "$(HOME="$DEMO_ROOT/server-1" hop invite --code)" && tmux paste-buffer'
