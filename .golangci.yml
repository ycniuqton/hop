version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocyclo
    - nestif
    - funlen
  settings:
    funlen:
      lines: 50
      statements: -1
    nestif:
      min-complexity: 4
    gocyclo:
      min-complexity: 15
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [funlen]
      # DECISIONS.md #8: keep feature/s3/manager until transfermanager reaches 1.0.
      - path: internal/store/s3\.go
        linters: [staticcheck]
        text: "SA1019: .*feature/s3/manager"
formatters:
  enable:
    - gofmt
    - goimports
